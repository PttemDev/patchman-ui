[package]
name = "patchman-desktop"
version = "1.79.0"
description = "PatchMan desktop shell — spawns the embedded Go BE and renders the FE."
authors = ["PatchMan"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "patchman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.5"
# Launch token for the embedded BE (DESKTOP_SECURITY_RFC L1); already in the lock.
getrandom = "0.2"

# App lock / step-up auth (src/security.rs): LocalAuthentication via the
# objc2 runtime and CoreGraphics' session dictionary for screen-lock state.
# All already in the lock through tauri/tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
core-foundation = "0.10"
# Cipher key in the login Keychain instead of a file next to the DB (RFC L5).
security-framework = "3"

# Windows / Linux: forward a patchman:// deep link from a second launch to the
# running app (see run() in src/lib.rs). macOS does this natively.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Release profile — minimal tuning only.
#
# Landmines we stepped on and must avoid:
#   * LTO ("thin"/"fat") forces embed-bitcode=on → a ~2GB __TEXT,__const
#     bitcode blob on macOS that `strip` can't remove.
#   * opt-level="s" shrinks code but leaves per-object files big enough to
#     overflow Mach-O's 32-bit relocation offset ("object file too large").
#   * A lib+bin split produces a 4.5GB rlib that overflows the Mach-O
#     archive string-table limit — see src/main.rs for why we're bin-only.
# Leaving opt-level/codegen-units at Cargo's release defaults + strip gets
# us a working signed build. Size tuning can be revisited once the build
# is stable.
[profile.release]
strip = true
panic = "abort"
incremental = false
