<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="patchman-title patchman-desc">
  <title id="patchman-title">PatchMan</title>
  <desc id="patchman-desc">An outlined yellow Pacman chasing a fleeing orange paper airplane. Motion lines trail behind Pacman to suggest forward momentum.</desc>

  <!-- Motion / speed lines behind Pacman (z-order: rendered first so
       Pacman is on top of them). Three short horizontal dashes echo the
       arcade-game "running fast" trope. -->
  <g stroke="#1A2940" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.55">
    <line x1="120" y1="420" x2="220" y2="420" />
    <line x1="70"  y1="512" x2="190" y2="512" />
    <line x1="120" y1="604" x2="220" y2="604" />
  </g>

  <!-- Pacman body — wider 80° mouth so the chomp reads, navy outline for
       cartoon weight, classic arcade-yellow fill. Path: center → top
       mouth corner → counterclockwise long arc through the left side of
       the disc → bottom mouth corner → close. -->
  <path
    d="M 512 512 L 757 306 A 320 320 0 1 0 757 718 Z"
    fill="#FFD43B"
    stroke="#1A2940"
    stroke-width="20"
    stroke-linejoin="round"
  />

  <!-- Eye: tall oval rather than a dot — feels more character-like and
       matches modern Pacman art direction. Positioned upper-rear of the
       face so it's never obscured by the mouth at small sizes. -->
  <ellipse cx="448" cy="312" rx="22" ry="34" fill="#1A2940" />

  <!-- Paper airplane in Postman orange, two-tone fold + outline so the
       silhouette reads at small sizes too. Tail sits inside the mouth
       cavity, tip just past the disc edge — Pacman is closing on the
       plane's rear, the plane is fleeing right. -->
  <g stroke="#1A2940" stroke-width="14" stroke-linejoin="round">
    <path d="M 810 462 L 980 512 L 884 512 Z" fill="#FF6C37" />
    <path d="M 884 512 L 980 512 L 810 562 Z" fill="#D14817" />
  </g>
</svg>
